spring:
  application:
    name: patrol

server:
  port: 8080

patrol:
  cors:
    # Origins of the delivered frontend. Override with PATROL_CORS_ALLOWED_ORIGINS.
    # `gradlew frontend` serves it on the first free port of 5500, 4200, 8081, 5555.
    allowed-origins: http://localhost:5500,http://localhost:4200,http://localhost:8081,http://localhost:5555,http://127.0.0.1:5500,http://localhost:5173
